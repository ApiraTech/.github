name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: []
assignees: []
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and requests for this idea.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What need would this address, and who would benefit?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or outcome you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other approaches you considered.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add examples, mockups, or related references.
    validations:
      required: false
