name: No internal identifiers

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scan:
    name: Scan public content
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run scan and controls
        run: ./scripts/no-internal-identifiers.sh --self-test
